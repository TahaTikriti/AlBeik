<!doctype html>
<!--
  Source of public/og.png, the image shown when a link to the site is shared
  (WhatsApp, iMessage, social). Logo and slogan only; everything important
  sits in the middle square, which some apps crop to.

  To re-render after editing (macOS, from the repo root), then downscale the
  2x result to 1200x630:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
      --virtual-time-budget=3000 --screenshot=og@2x.png "file://$PWD/docs/brand/share-card.html"
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; display: grid; place-items: center; background: #000; font-family: Anton, Impact, sans-serif; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(55% 60% at 50% 118%, rgba(216, 38, 47, 0.6), transparent 72%),
      radial-gradient(35% 40% at 12% 8%, rgba(255, 255, 255, 0.07), transparent 70%),
      radial-gradient(35% 40% at 88% 12%, rgba(255, 255, 255, 0.05), transparent 70%); }
  .bar { position: absolute; inset: auto 0 0; height: 12px; background: #d8262f; }
  .stack { position: relative; display: grid; justify-items: center; gap: 34px; margin-top: -8px; }
  .panel { background: #fff; border-radius: 24px; padding: 30px 40px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.85); }
  .panel img { display: block; width: 460px; }
  h1 { margin: 0; color: #fff; font-weight: 400; text-transform: uppercase; text-align: center; line-height: 1; }
  .l1 { display: block; font-size: 54px; letter-spacing: 0.005em; }
  .l1 em { font-style: normal; color: #f4313f; }
  .l2 { display: block; margin-top: 10px; font-size: 28px; letter-spacing: 0.03em; color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="stack">
    <div class="panel"><img src="../../src/theme/brand/albeik-logo-horizontal-original.png" alt=""></div>
    <h1><span class="l1">The recipe is <em>Lebanese.</em></span><span class="l2">The extra attitude is ours.</span></h1>
  </div>
  <div class="bar"></div>
</body>
</html>
